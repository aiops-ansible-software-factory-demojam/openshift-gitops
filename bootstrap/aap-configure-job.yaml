apiVersion: batch/v1
kind: Job
metadata:
  name: aap-configure
  namespace: ansible-automation-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: aap-controller
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9@sha256:d97a6fc9c34132bfddf5c8f0db93a24fea67ed3db2094d15f78d7f4eba724f1f
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -ceu
            - |
              git clone --depth 1 --branch main "$CONFIG_REPO_URL" /runner/project
              cd /runner/project
              ansible-galaxy collection install -r requirements.yml
              exec ansible-playbook playbooks/aap/configure-aap.yml
          envFrom:
            - secretRef:
                name: aap-bootstrap-inputs
          env:
            - name: HOME
              value: /runner
            - name: CONFIG_REPO_URL
              value: ''
            - name: AAP_EE_IMAGE
              value: ''
          volumeMounts:
            - name: runner
              mountPath: /runner
      volumes:
        - name: runner
          emptyDir: {}
