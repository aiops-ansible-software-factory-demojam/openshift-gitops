# The only bootstrap-managed custom credential type. Runtime material is passed
# to config-as-code through private execution environment variables.
kind: cloud
inputs:
  fields:
    - id: host
      label: AAP URL
      type: string
    - id: username
      label: AAP username
      type: string
    - id: password
      label: AAP password
      type: string
      secret: true
    - id: oidc_issuer
      label: Demo OIDC issuer
      type: string
    - id: oidc_secret
      label: Demo OIDC client secret
      type: string
      secret: true
    - id: ee_image
      label: Supported execution environment image
      type: string
    - id: vm_host
      label: Kubernetes API URL
      type: string
    - id: vm_token
      label: VM service account token
      type: string
      secret: true
    - id: vm_ca
      label: Kubernetes CA
      type: string
      multiline: true
    - id: ssh_private
      label: VM SSH private key
      type: string
      secret: true
      multiline: true
    - id: ssh_public
      label: VM SSH public key
      type: string
    - id: entitlement
      label: RHEL entitlement PEM
      type: string
      secret: true
      multiline: true
    - id: eda_token
      label: EDA webhook token
      type: string
      secret: true
    - id: forgejo_token
      label: Forgejo issue token
      type: string
      secret: true
    - id: forgejo_eda_token
      label: Forgejo EDA webhook token
      type: string
      secret: true
    - id: ao_client_id
      label: AO webhook client ID
      type: string
    - id: ao_client_secret
      label: AO webhook client secret
      type: string
      secret: true
    - id: backend
      label: Guest backend
      type: string
    - id: mcp_material
      label: Guest MCP digest and TLS material
      type: string
      secret: true
      multiline: true
    - id: aws_region
      label: Guest AWS region
      type: string
    - id: aws_config
      label: Bootstrap-owned guest configuration
      type: string
      multiline: true
    - id: aws_access_key
      label: Scoped AAP AWS access key ID
      type: string
      secret: true
    - id: aws_secret_key
      label: Scoped AAP AWS secret access key
      type: string
      secret: true
  required:
    - host
    - username
    - password
    - oidc_issuer
    - oidc_secret
    - ee_image
    - vm_host
    - vm_token
    - vm_ca
    - ssh_private
    - ssh_public
    - eda_token
    - forgejo_token
    - forgejo_eda_token
    - ao_client_id
    - ao_client_secret
injectors:
  file:
    # AWS uses RHUI; CNV entitlement requirements are enforced by preflight
    # and configure-aap.yml. Render an empty file when AWS has no entitlement.
    template: "{{ entitlement | default('') }}"
  env:
    AAP_HOST: "{{ host }}"
    AAP_USERNAME: "{{ username }}"
    AAP_PASSWORD: "{{ password }}"
    DEMO_OIDC_ISSUER: "{{ oidc_issuer }}"
    DEMO_OIDC_CLIENT_SECRET: "{{ oidc_secret }}"
    AAP_EE_IMAGE: "{{ ee_image }}"
    DEMO_VM_API_HOST: "{{ vm_host }}"
    DEMO_VM_API_TOKEN: "{{ vm_token }}"
    DEMO_VM_API_CA: "{{ vm_ca }}"
    DEMO_VM_SSH_PRIVATE: "{{ ssh_private }}"
    DEMO_VM_SSH_PUBLIC: "{{ ssh_public }}"
    DEMO_RHEL_ENTITLEMENT_FILE: "{{ tower.filename }}"
    DEMO_EDA_WEBHOOK_TOKEN: "{{ eda_token }}"
    DEMO_FORGEJO_TOKEN: "{{ forgejo_token }}"
    DEMO_FORGEJO_EDA_WEBHOOK_TOKEN: "{{ forgejo_eda_token }}"
    DEMO_AUTOMATION_ORCHESTRATOR_CLIENT_ID: "{{ ao_client_id }}"
    DEMO_AUTOMATION_ORCHESTRATOR_CLIENT_SECRET: "{{ ao_client_secret }}"
    DEMO_BACKEND: "{{ backend }}"
    DEMO_WEBAPP_MCP_MATERIAL: "{{ mcp_material }}"
    DEMO_AWS_REGION: "{{ aws_region }}"
    DEMO_AWS_CONFIG: "{{ aws_config }}"
    DEMO_AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
    DEMO_AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
