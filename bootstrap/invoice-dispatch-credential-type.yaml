kind: cloud
inputs:
  fields:
    - {id: material, label: Invoice artifact access and metadata, type: string, secret: true, multiline: true}
    - {id: signing_key, label: Trusted public signing key, type: string, multiline: true}
    - {id: test_aws, label: Scoped EC2 test credentials and configuration, type: string, secret: true, multiline: true}
    - {id: test_ee, label: Immutable invoice test execution environment, type: string}
  required: [material, signing_key, test_aws, test_ee]
injectors:
  env:
    DEMO_INVOICE_MATERIAL: '{{ material }}'
    DEMO_INVOICE_SIGNING_KEY: '{{ signing_key }}'
    DEMO_INVOICE_TEST_AWS: '{{ test_aws }}'
    INVOICE_TEST_EE_IMAGE: '{{ test_ee }}'
