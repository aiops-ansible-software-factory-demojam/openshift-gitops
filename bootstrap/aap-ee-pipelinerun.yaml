apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: demojam-ee-
  namespace: ansible-automation-platform
spec:
  pipelineRef:
    name: demojam-ee
  taskRunTemplate:
    serviceAccountName: aap-ee-builder
    podTemplate:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: false
  timeouts:
    pipeline: 1h0m0s
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
