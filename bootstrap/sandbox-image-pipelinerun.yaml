apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: omnigent-opencode-
  namespace: omnigent-sandboxes
spec:
  pipelineRef:
    name: omnigent-opencode
  params:
    - name: REVISION
      value: main
    - name: IMAGE
      value: ''
    - name: REPO_URL
      value: ''
    - name: COLLECTION_REPO_URL
      value: ''
    - name: COLLECTION_REVISION
      value: ''
  taskRunTemplate:
    serviceAccountName: omnigent-image-builder
    podTemplate:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: false
  timeouts:
    pipeline: 1h0m0s
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
