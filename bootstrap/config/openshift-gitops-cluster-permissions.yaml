apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-gitops-demo-manager
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - configmaps
      - secrets
      - services
      - persistentvolumeclaims
      - limitranges
      - resourcequotas
    verbs:
      - "*"
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - "*"
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - "*"
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
      - clusterrolebindings
    verbs:
      - "*"
  - apiGroups:
      - image.openshift.io
    resources:
      - imagestreams
    verbs:
      - "*"
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - "*"
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
      - routes/custom-host
    verbs:
      - "*"
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - probes
      - servicemonitors
      - prometheusrules
      - alertmanagerconfigs
    verbs:
      - "*"
  - apiGroups:
      - aap.ansible.com
    resources:
      - ansibleautomationplatforms
    verbs:
      - "*"
  - apiGroups:
      - hco.kubevirt.io
    resources:
      - hyperconvergeds
    verbs:
      - '*'
  - apiGroups:
      - tekton.dev
    resources:
      - tasks
      - pipelines
    verbs:
      - '*'
  # Argo must also hold the permissions in the VM Roles it creates.
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs:
      - '*'
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes
      - datavolumes/source
      - datasources
    verbs:
      - '*'
  - apiGroups:
      - ''
    resources:
      - pods
      - events
    verbs:
      - get
      - list
      - watch
  # Only the sandbox image builder identity receives these RoleBindings.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - system:openshift:scc:privileged
      - system:image-builder
    verbs:
      - bind

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-demo-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-demo-manager
subjects:
  - kind: ServiceAccount
    name: demojam-gitops-argocd-application-controller
    namespace: openshift-gitops
