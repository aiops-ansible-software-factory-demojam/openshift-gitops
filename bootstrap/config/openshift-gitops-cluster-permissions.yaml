apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-gitops-kataconfig-manager
rules:
  - apiGroups:
      - kataconfiguration.openshift.io
    resources:
      - kataconfigs
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - configmaps
      - secrets
      - services
      - persistentvolumeclaims
      - limitranges
      - resourcequotas
    verbs:
      - "*"
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - "*"
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - "*"
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - "*"
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - "*"
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
      - routes/custom-host
    verbs:
      - "*"
  - apiGroups:
      - k8s.keycloak.org
    resources:
      - keycloaks
      - keycloakrealmimports
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-kataconfig-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-kataconfig-manager
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
