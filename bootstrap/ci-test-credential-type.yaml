kind: cloud
inputs:
  fields:
    - {id: profile, label: Disposable guest settings, type: string, multiline: true}
    - {id: aws_credentials, label: Scoped test AWS credentials, type: string, multiline: true, secret: true}
    - {id: kubeconfig, label: Scoped Molecule kubeconfig, type: string, multiline: true, secret: true}
  required: [profile]
injectors:
  file:
    template.profile: '{{ profile }}'
    template.aws: '{{ aws_credentials }}'
    template.kubeconfig: '{{ kubeconfig }}'
  env:
    DEMO_CI_PROFILE_FILE: '{{ tower.filename.profile }}'
    AWS_SHARED_CREDENTIALS_FILE: '{{ tower.filename.aws }}'
    AWS_EC2_METADATA_DISABLED: 'true'
    KUBECONFIG: '{{ tower.filename.kubeconfig }}'
