apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-copier
  namespace: agentic-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-openshell-tls
  namespace: openshell
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - openshell-client-tls
      - openshell-server-tls
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-poc-read-openshell-tls
  namespace: openshell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-openshell-tls
subjects:
  - kind: ServiceAccount
    name: tls-copier
    namespace: agentic-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: write-openshell-client-tls
  namespace: agentic-poc
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - openshell-client-tls
    verbs:
      - get
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-copier-write
  namespace: agentic-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: write-openshell-client-tls
subjects:
  - kind: ServiceAccount
    name: tls-copier
    namespace: agentic-poc
