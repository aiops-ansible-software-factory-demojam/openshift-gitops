apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: agentic-poc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-poc-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-poc-runner
    spec:
      serviceAccountName: runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: image-registry.openshift-image-registry.svc:5000/agentic-poc/agentic-poc-runner:1.0.0
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-auth
                  key: token
            - name: OPENSHELL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: runner-auth
                  key: oidc-client-secret
            - name: RUNNER_TLS_CERT
              value: /etc/runner-tls/tls.crt
            - name: RUNNER_TLS_KEY
              value: /etc/runner-tls/tls.key
            - name: RUNNER_DATA
              value: /data
            - name: SANDBOX_POLICY
              value: /etc/agentic-poc/sandbox-policy.yaml
            - name: HOME
              value: /home/runner
            - name: OPENSHELL_NO_BROWSER
              value: "1"
          envFrom:
            - configMapRef:
                name: runner-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/runner-tls
              readOnly: true
            - name: policy
              mountPath: /etc/agentic-poc
              readOnly: true
            - name: openshell-mtls
              mountPath: /etc/openshell-mtls
              readOnly: true
            - name: home
              mountPath: /home/runner
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: runner-data
        - name: tls
          secret:
            secretName: runner-tls
        - name: policy
          configMap:
            name: sandbox-policy
        - name: openshell-mtls
          secret:
            secretName: openshell-client-tls
            optional: true
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: agentic-poc
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: runner-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentic-poc-runner
  ports:
    - name: https
      port: 8443
      targetPort: https
---
