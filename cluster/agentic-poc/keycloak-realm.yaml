apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: agentic-poc
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  keycloakCRName: keycloak
  realm:
    realm: agentic-poc
    enabled: true
    displayName: Agentic POC
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: false
    roles:
      realm:
        - name: openshell-user
          description: OpenShell user role for the runner
        - name: openshell-admin
          description: OpenShell admin role for bootstrap
    clients:
      - clientId: openshell-cli
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
    # Confidential clients and their service-account role mappings are
    # provisioned outside Git after this realm exists. See agentic-dev-poc/README.md.
