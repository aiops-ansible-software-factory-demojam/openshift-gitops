apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      serviceAccountName: forgejo
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.5-rootless@sha256:5effb7305584aca479b29fde6f9631a6dbe86ae798ae02eeea33a3666f0c0bf8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: FORGEJO__actions__ENABLED
              value: "false"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__PATH
              value: /var/lib/gitea/data/forgejo.db
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: FORGEJO__oauth2_client__ACCOUNT_LINKING
              value: disabled
            - name: FORGEJO__server__ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: forgejo-url
                  key: root-url
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__webhook__ALLOWED_HOST_LIST
              value: external,private
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: oidc
              mountPath: /etc/demo-oidc
              readOnly: true
            - name: state
              mountPath: /var/lib/gitea
      volumes:
        - name: oidc
          secret:
            secretName: demo-oidc
        - name: state
          persistentVolumeClaim:
            claimName: forgejo
