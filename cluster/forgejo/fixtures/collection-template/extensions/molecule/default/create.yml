---
- name: Check sandbox test prerequisites
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    molecule_boot_source: "{{ hostvars[groups['molecule'][0]].mp_defaults.kubevirt.boot_source }}"
  tasks:
    - name: Require the sandbox test kubeconfig
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'KUBECONFIG') | length > 0
        fail_msg: Run this scenario in a demo Omnigent sandbox with its test credential mount.

    - name: Read the golden image DataSource
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataSource
        name: "{{ molecule_boot_source.source_ref.name }}"
        namespace: "{{ molecule_boot_source.source_ref.namespace }}"
      register: molecule_datasource

    - name: Require a ready golden image
      ansible.builtin.assert:
        that:
          - molecule_datasource.resources | length == 1
          - >-
            molecule_datasource.resources[0].status.conditions | default([])
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True') | list | length == 1
        fail_msg: >-
          DataSource {{ molecule_boot_source.source_ref.namespace }}/{{ molecule_boot_source.source_ref.name }}
          must be ready before running Molecule.

- name: Provision molecule instances
  ansible.builtin.import_playbook: david_igou.molecule_provisioners.create
