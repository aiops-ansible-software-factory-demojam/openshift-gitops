---
- name: Destroy molecule instances
  ansible.builtin.import_playbook: david_igou.molecule_provisioners.destroy

- name: Release the completed run identity
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove the run ID after successful VM deletion
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/run-id"
        state: absent
