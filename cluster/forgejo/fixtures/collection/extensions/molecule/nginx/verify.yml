---
- name: Verify the test hosts
  ansible.builtin.import_playbook: ../utils/playbooks/verify.yml

- name: Verify nginx serves HTTP with its package worker account
  hosts: molecule
  become: true
  gather_facts: false
  tasks:
    - name: Request the nginx home page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      register: nginx_http
      until: nginx_http.status == 200
      retries: 6
      delay: 2

    - name: Read nginx process users
      ansible.builtin.command:
        argv:
          - ps
          - -o
          - user=
          - -C
          - nginx
      register: nginx_process_users
      changed_when: false

    - name: Require a worker running as the package nginx account
      ansible.builtin.assert:
        that:
          - "'nginx' in nginx_process_users.stdout_lines | map('trim') | list"
        fail_msg: nginx must serve HTTP with a worker running as the nginx account.
