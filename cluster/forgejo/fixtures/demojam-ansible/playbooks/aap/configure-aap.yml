---
- name: Configure the demo automation platform
  hosts: aap
  connection: local
  gather_facts: false
  tasks:
    - name: Load the current Forgejo configuration data
      ansible.builtin.include_vars:
        dir: ../../group_vars/aap
      no_log: true

    - name: Check required runtime configuration
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_username | length > 0
          - aap_password | length > 0
          - aap_ee_image | length > 0
        fail_msg: Supply the environment variables documented in README.md.

    - name: Apply inventory-defined AAP objects
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      vars:
        aap_configuration_secure_logging: true
        assign_default_ee_to_org: false
        aap_configuration_async_retries: 300
        aap_configuration_async_delay: 2
        # Same gateway compatibility workaround as the homelab dispatcher.
        aap_configuration_dispatcher_exclude_roles:
          - controller_applications

    - name: Check demo identity inputs
      ansible.builtin.assert:
        that:
          - demo_oidc_issuer | length > 0
          - demo_oidc_credentials.client_secret_lookup | length > 0
        fail_msg: Run bootstrap to supply the demo identity dispatch credential.
      no_log: true

    - name: Configure the inventory-defined OIDC authenticator
      ansible.platform.authenticator:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: true
        name: "{{ demo_oidc_authenticator.name }}"
        type: "{{ demo_oidc_authenticator.type }}"
        configuration: "{{ demo_oidc_authenticator.configuration }}"
        enabled: "{{ demo_oidc_authenticator.enabled }}"
        create_objects: "{{ demo_oidc_authenticator.create_objects }}"
        remove_users: "{{ demo_oidc_authenticator.remove_users }}"
        state: present
      no_log: true

    - name: Configure the inventory-defined OIDC access mappings
      ansible.platform.authenticator_map:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: true
        authenticator: "{{ demo_oidc_authenticator.name }}"
        name: "{{ item.name }}"
        map_type: "{{ item.map_type }}"
        organization: "{{ item.organization | default(omit) }}"
        triggers: "{{ item.triggers }}"
        state: present
      loop: "{{ demo_oidc_authenticator_maps }}"
      no_log: true
