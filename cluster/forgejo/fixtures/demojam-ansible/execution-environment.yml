---
version: 3
images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9:latest@sha256:d97a6fc9c34132bfddf5c8f0db93a24fea67ed3db2094d15f78d7f4eba724f1f
dependencies:
  python_interpreter:
    python_path: /usr/bin/python3.12
  galaxy: requirements.yml
  # The supported base already includes these collections' Python/system deps.
  exclude:
    all_from_collections:
      - '~.*'
options:
  package_manager_path: /usr/bin/microdnf
  skip_pip_install: true
build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: --force --no-deps
additional_build_steps:
  # Buildah mounts this secret only during RUN steps; it is never copied.
  prepend_galaxy:
    - ENV ANSIBLE_CONFIG=/run/secrets/automation-hub.cfg
