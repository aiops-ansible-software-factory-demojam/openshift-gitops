---
# The Resource Operator creates this project before the first dispatch.
# Dispatch adds update-on-launch, which the installed CR schema cannot express.
controller_projects:
  - name: demojam-ansible
    organization: demo
    scm_type: git
    scm_url: http://forgejo.forgejo.svc.cluster.local:3000/demo-owner/demojam-ansible.git
    scm_branch: main
    scm_update_on_launch: true
    update_project: true
    wait: true
