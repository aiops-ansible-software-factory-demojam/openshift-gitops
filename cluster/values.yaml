default:
  app:
    enabled: true
    enableAutoSync: true
    autoSyncPrune: false
    project: cluster-config
    labels:
      app-source: demo-cluster
      repo: cluster-config
    destination:
      namespace: openshift-gitops
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/aiops-ansible-software-factory-demojam/openshift-gitops.git
      targetRevision: main
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    syncPolicyRetry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

projects:
  cluster-config:
    description: Demo cluster configuration
    annotations:
      argocd.argoproj.io/sync-wave: '-1'
    sourceRepos:
      - https://github.com/aiops-ansible-software-factory-demojam/openshift-gitops.git
    destinations: |
      - namespace: '*'
        server: https://kubernetes.default.svc
    extraFields: |
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'

applications:
  cloudnative-pg:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "0"
    destination:
      namespace: cloudnative-pg
    source:
      path: cluster/cloudnative-pg

  automation-orchestrator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "30"
    destination:
      namespace: automation-orchestrator
    source:
      path: cluster/automation-orchestrator

  agent-sandbox-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "10"
    destination:
      namespace: agent-sandbox-system
    source:
      path: cluster/agent-sandbox-operator

  rhbk:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "10"
    destination:
      namespace: keycloak
    source:
      path: cluster/rhbk
    ignoreDifferences:
      - group: k8s.keycloak.org
        kind: Keycloak
        jsonPointers:
          - /spec/proxy
          - /spec/db/port

  rhdh:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "10"
    destination:
      namespace: rhdh
    source:
      path: cluster/rhdh

  forgejo-demo:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "10"
    destination:
      namespace: forgejo-demo
    source:
      path: cluster/forgejo-demo
    ignoreDifferences:
      - group: apps
        kind: Deployment
        name: forgejo-demo
        namespace: forgejo-demo
        jsonPointers:
          - /spec/replicas

  openshell:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "20"
    destination:
      namespace: openshell
    source:
      path: cluster/openshell
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        name: openshell
        namespace: openshell
        jsonPointers:
          - /spec/volumeClaimTemplates/0/apiVersion
          - /spec/volumeClaimTemplates/0/kind

  omnigent:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: "30"
    destination:
      namespace: omnigent
    source:
      path: cluster/omnigent
