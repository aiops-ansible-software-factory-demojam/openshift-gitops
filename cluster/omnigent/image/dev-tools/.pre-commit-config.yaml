---
minimum_pre_commit_version: '4.3.0'
repos:
  # Install published packages in isolated hook environments. No dependency on
  # the sandbox's tool versions or GitHub access for fetching hook repositories.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - text
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
        name: Fix end of files
        entry: end-of-file-fixer
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - text
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: check-merge-conflict
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - text
      - id: check-added-large-files
        name: Check added large files
        entry: check-added-large-files
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
      - id: check-yaml
        name: Check YAML syntax and duplicate keys
        entry: check-yaml
        language: python
        additional_dependencies:
          - pre-commit-hooks==6.0.0
        types:
          - yaml
      - id: yamllint
        name: Lint YAML
        entry: yamllint --strict
        language: python
        additional_dependencies:
          - yamllint==1.38.0
        types:
          - yaml
      - id: ansible-lint
        name: Lint Ansible collection
        # Use current source during offline lint without changing Galaxy's
        # installation destination for Molecule or other collection commands.
        entry: env ANSIBLE_COLLECTIONS_PATH=.ansible/source:~/.ansible/collections ansible-lint
        language: python
        additional_dependencies:
          - ansible-core==2.21.4
          - ansible-lint==26.8.0
          - yamllint==1.38.0
        # Run from the collection root, including Molecule playbooks, even when
        # only configuration or documentation was staged.
        pass_filenames: false
        always_run: true
