apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: omnigent-opencode
  namespace: omnigent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/aiops-ansible-software-factory-demojam/openshift-gitops.git
      ref: demo-qrs5n
    contextDir: cluster/omnigent/image
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: omnigent-opencode:adt26.9.0-omni0.15.0-opencode1.18.32-v3
  triggers:
    - type: ConfigChange
