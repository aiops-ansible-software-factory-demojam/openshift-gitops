apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: omnigent-pg
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  instances: 1
  enablePDB: false
  bootstrap:
    initdb:
      database: omnigent
      owner: omnigent
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
