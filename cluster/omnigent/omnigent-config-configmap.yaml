apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: omnigent
data:
  HOST: 0.0.0.0
  PORT: '8000'
  ARTIFACT_DIR: /data/artifacts
  OMNIGENT_AUTH_ENABLED: '1'
  OMNIGENT_AUTH_PROVIDER: accounts
  OMNIGENT_ACCOUNTS_BASE_URL: https://omnigent.apps.cluster-8qxkk.dyn.redhatworkshops.io
  OMNIGENT_ACCOUNTS_INIT_ADMIN_USERNAME: demo-admin
  OMNIGENT_ACCOUNTS_AUTO_OPEN: '0'
  OMNIGENT_MACHINE_SUB: automation-orchestrator
  OMNIGENT_MACHINE_TOKEN_TTL: '300'
  OMNIGENT_BUILTIN_AGENT_DIRS: /etc/omnigent/agents/demo.yaml
  OPENSHELL_GATEWAY: demo
  XDG_CONFIG_HOME: /etc/omnigent-xdg
  OMNIGENT_RUNNER_ENV_PASSTHROUGH: OPENCODE_CONFIG_CONTENT,OPENAI_API_KEY,https_proxy,http_proxy,HTTPS_PROXY,HTTP_PROXY,NO_PROXY,no_proxy
