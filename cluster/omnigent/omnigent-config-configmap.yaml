apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: omnigent
data:
  HOST: 0.0.0.0
  PORT: '8000'
  ARTIFACT_DIR: /data/artifacts
  OMNIGENT_AUTH_ENABLED: '0'
  OMNIGENT_BUILTIN_AGENT_DIRS: /etc/omnigent/agents/automation-developer.yaml
  OMNIGENT_RUNNER_ENV_PASSTHROUGH: OPENCODE_CONFIG_CONTENT,OPENAI_API_KEY
  OMNIGENT_AGENT_SANDBOX_WORKSPACE_SIZE: 5Gi
