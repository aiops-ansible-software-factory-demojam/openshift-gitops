apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: omnigent
data:
  HOST: 0.0.0.0
  PORT: '8000'
  ARTIFACT_DIR: /data/artifacts
  OMNIGENT_AUTH_ENABLED: '1'
  OMNIGENT_BUILTIN_AGENT_DIRS: /etc/omnigent/agents/automation-developer.yaml
  OMNIGENT_RUNNER_ENV_PASSTHROUGH: OPENCODE_CONFIG_CONTENT,OPENAI_API_KEY,FORGEJO_URL,FORGEJO_TOKEN,FORGEJO_USERNAME,BACKSTAGE_URL,BACKSTAGE_TOKEN,KUBECONFIG,MOLECULE_GLOB,ANSIBLE_COLLECTIONS_PATH,PROVISIONER,AWS_REGION,AWS_DEFAULT_REGION,AWS_SHARED_CREDENTIALS_FILE,AWS_EC2_METADATA_DISABLED,MOLECULE_AWS_DEPLOYMENT_ID,MOLECULE_AWS_VPC_ID,MOLECULE_AWS_SUBNET_ID,MOLECULE_AWS_INSTANCE_TYPE,MOLECULE_AWS_SSH_CIDR,MOLECULE_AWS_HTTP_CIDR,MOLECULE_AWS_RHEL9_AMI_ID,MOLECULE_AWS_RHEL10_AMI_ID,MOLECULE_AWS_ROOT_VOLUME_SIZE
  OMNIGENT_AGENT_SANDBOX_WORKSPACE_SIZE: 5Gi
  OMNIGENT_AUTH_PROVIDER: oidc
  OMNIGENT_ADMIN_LIST_PATH: /etc/omnigent/identity/admins
