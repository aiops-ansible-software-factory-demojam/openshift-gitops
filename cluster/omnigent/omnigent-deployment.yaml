apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      annotations:
        # The config is a subPath mount; roll the server to load test credentials.
        demo.igou.systems/sandbox-config-revision: molecule-v2
      labels:
        app: omnigent
    spec:
      serviceAccountName: omnigent-server
      securityContext:
        runAsNonRoot: true
      containers:
        - name: omnigent
          image: ghcr.io/omnigent-ai/omnigent-server-kubernetes@sha256:ed3ae35d30572dcd929ba4e1edefdcec53ef178ab2f8147d11a8f2f33dded123
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: omnigent-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnigent-pg-app
                  key: uri
            - name: OMNIGENT_CONFIG
              value: /etc/omnigent/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
            - name: sandbox-config
              mountPath: /etc/omnigent/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: agent
              mountPath: /etc/omnigent/agents
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
        - name: api-proxy
          image: docker.io/nginxinc/nginx-unprivileged:1.29.4-alpine3.23@sha256:a6c4f61f456b85b8fdf7ec7ab28cc3e299440e6fb4a9dea520e5fd8fd440025e
          ports:
            - name: proxy
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: proxy-auth
              mountPath: /etc/nginx/auth
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: omnigent-artifacts
        - name: sandbox-config
          configMap:
            name: omnigent-sandbox-config
        - name: agent
          secret:
            secretName: omnigent-agent
        - name: proxy-config
          configMap:
            name: omnigent-proxy-config
        - name: proxy-auth
          secret:
            secretName: omnigent-proxy-auth
