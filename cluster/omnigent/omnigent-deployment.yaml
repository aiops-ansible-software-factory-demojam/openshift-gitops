apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      annotations:
        demo.igou.systems/sandbox-config-revision: identity-v2-native-oidc
      labels:
        app: omnigent
    spec:
      serviceAccountName: omnigent-server
      securityContext:
        runAsNonRoot: true
      containers:
        - name: omnigent
          image: ghcr.io/omnigent-ai/omnigent-server-kubernetes@sha256:ed3ae35d30572dcd929ba4e1edefdcec53ef178ab2f8147d11a8f2f33dded123
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: omnigent-config
            - secretRef:
                name: omnigent-machine-auth
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnigent-pg-app
                  key: uri
            - name: OMNIGENT_CONFIG
              value: /etc/omnigent/config.yaml
            - name: OMNIGENT_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: issuer
            - name: OMNIGENT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: client-id
            - name: OMNIGENT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: client-secret
            - name: OMNIGENT_OIDC_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: redirect-url
            - name: OMNIGENT_OIDC_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: cookie-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
            - name: sandbox-config
              mountPath: /etc/omnigent/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: agent
              mountPath: /etc/omnigent/agents
              readOnly: true
            - name: identity
              mountPath: /etc/omnigent/identity
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: omnigent-artifacts
        - name: sandbox-config
          configMap:
            name: omnigent-sandbox-config
        - name: agent
          secret:
            secretName: omnigent-agent
        - name: identity
          configMap:
            name: omnigent-identity
