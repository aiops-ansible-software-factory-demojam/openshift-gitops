apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-sandbox-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: agent_sandbox
      server_url: http://omnigent.omnigent.svc.cluster.local:8000
      kubernetes:
        namespace: omnigent-sandboxes
        service_account: omnigent-runner
        secret_name: omnigent-model
        image: image-registry.openshift-image-registry.svc:5000/omnigent-sandboxes/omnigent-opencode:adt26.9.0-omni0.15.0-opencode1.18.32-v4
        in_cluster: true
        pod_ready_timeout_s: 300
        home_size_limit: 4Gi
        env:
          - OMNIGENT_RUNNER_ENV_PASSTHROUGH
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
            ephemeral-storage: 2Gi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 6Gi
