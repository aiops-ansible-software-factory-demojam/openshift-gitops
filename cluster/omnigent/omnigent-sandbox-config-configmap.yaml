apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-sandbox-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: openshell
      server_url: http://omnigent.omnigent.svc.cluster.local:8000
      openshell:
        cluster: demo
        image: image-registry.openshift-image-registry.svc:5000/openshell/omnigent-opencode:1.18.32
        env:
          - OPENAI_API_KEY
          - OPENCODE_CONFIG_CONTENT
          - FORGEJO_TOKEN
          - FORGEJO_URL
          - FORGEJO_USERNAME
          - BACKSTAGE_URL
          - OMNIGENT_RUNNER_ENV_PASSTHROUGH
