apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: omnigent
  namespace: omnigent
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  subdomain: omnigent
  to:
    kind: Service
    name: omnigent
  port:
    targetPort: proxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
