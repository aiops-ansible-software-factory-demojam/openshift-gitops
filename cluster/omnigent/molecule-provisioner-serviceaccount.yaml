apiVersion: v1
kind: ServiceAccount
metadata:
  name: molecule-provisioner
  namespace: omnigent-sandboxes
automountServiceAccountToken: false
---
# The token controller supplies token and ca.crt; credential values stay out of Git.
# Omnigent mounts this explicitly because its runner disables automatic tokens.
apiVersion: v1
kind: Secret
metadata:
  name: molecule-provisioner-token
  namespace: omnigent-sandboxes
  annotations:
    kubernetes.io/service-account.name: molecule-provisioner
type: kubernetes.io/service-account-token
