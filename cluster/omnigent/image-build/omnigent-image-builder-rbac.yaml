apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigent-image-builder
  namespace: omnigent-sandboxes
---
# Buildah runs only in this one-off build identity, not in AAP job pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-image-builder-scc
  namespace: omnigent-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: omnigent-image-builder
    namespace: omnigent-sandboxes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-image-builder-registry
  namespace: omnigent-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: omnigent-image-builder
    namespace: omnigent-sandboxes
