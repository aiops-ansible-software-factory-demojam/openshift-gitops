apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: omnigent-opencode
  namespace: omnigent-sandboxes
spec:
  description: Build the ADT/OpenCode sandbox image with image storage on a PVC.
  params:
    - name: REVISION
      type: string
      default: main
    - name: IMAGE
      type: string
    - name: REPO_URL
      type: string
      default: https://github.com/aiops-ansible-software-factory-demojam/openshift-gitops.git
    - name: COLLECTION_REPO_URL
      type: string
    - name: COLLECTION_REVISION
      type: string
  workspaces:
    - name: source
  results:
    - name: IMAGE
      value: $(tasks.build-image.results.IMAGE)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: SOURCE_COMMIT
      value: $(tasks.build-image.results.SOURCE_COMMIT)
    - name: COLLECTION_SOURCE_COMMIT
      value: $(tasks.build-image.results.COLLECTION_SOURCE_COMMIT)
  tasks:
    - name: build-image
      params:
        - name: REVISION
          value: $(params.REVISION)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: REPO_URL
          value: $(params.REPO_URL)
        - name: COLLECTION_REPO_URL
          value: $(params.COLLECTION_REPO_URL)
        - name: COLLECTION_REVISION
          value: $(params.COLLECTION_REVISION)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: REVISION
            type: string
          - name: IMAGE
            type: string
          - name: REPO_URL
            type: string
          - name: COLLECTION_REPO_URL
            type: string
          - name: COLLECTION_REVISION
            type: string
        workspaces:
          - name: source
        results:
          - name: IMAGE
          - name: IMAGE_DIGEST
          - name: SOURCE_COMMIT
          - name: COLLECTION_SOURCE_COMMIT
        volumes:
          - name: registry-ca
            configMap:
              name: openshift-service-ca.crt
        steps:
          - name: clone
            image: ghcr.io/ansible/community-ansible-dev-tools@sha256:775c81d53058009dd47b97872f4a86d3b0a9ce16ad9af3cc48514ce4197aa787
            securityContext:
              runAsUser: 0
            env:
              - name: HOME
                value: /tekton/home
              - name: REVISION
                value: $(params.REVISION)
              - name: REPO_URL
                value: $(params.REPO_URL)
              - name: COLLECTION_REPO_URL
                value: $(params.COLLECTION_REPO_URL)
              - name: COLLECTION_REVISION
                value: $(params.COLLECTION_REVISION)
            script: |
              #!/bin/bash
              set -euo pipefail
              git init "$(workspaces.source.path)/repo"
              git -C "$(workspaces.source.path)/repo" fetch --depth 1 \
                "$REPO_URL" "$REVISION"
              git -C "$(workspaces.source.path)/repo" checkout --detach FETCH_HEAD
              git -C "$(workspaces.source.path)/repo" rev-parse HEAD | tr -d '\n' > "$(results.SOURCE_COMMIT.path)"
              [[ $COLLECTION_REVISION =~ ^[0-9a-f]{40}$ ]]
              [[ $COLLECTION_REPO_URL =~ ^https://github.com/aiops-ansible-software-factory-demojam/[a-zA-Z0-9_.-]+\.git$ ]]
              git init "$(workspaces.source.path)/collection"
              git -C "$(workspaces.source.path)/collection" remote add origin "$COLLECTION_REPO_URL"
              git -C "$(workspaces.source.path)/collection" fetch --depth 1 origin "$COLLECTION_REVISION"
              git -C "$(workspaces.source.path)/collection" checkout --detach FETCH_HEAD
              git -C "$(workspaces.source.path)/collection" rev-parse HEAD | tr -d '\n' > "$(results.COLLECTION_SOURCE_COMMIT.path)"
              source "$(workspaces.source.path)/repo/bootstrap/bootstrap.sh"
              demo_sandbox_image_context "$(workspaces.source.path)/collection"
          - name: build-and-push
            image: quay.io/buildah/stable:v1.43.2@sha256:704af5d17babbd88bd93c06ecea7554001a2e9570e1fd54687188d3ae5de0e55
            workingDir: $(workspaces.source.path)/repo/cluster/omnigent/image
            securityContext:
              runAsUser: 0
              privileged: true
            env:
              - name: IMAGE
                value: $(params.IMAGE)
            volumeMounts:
              - name: registry-ca
                mountPath: /etc/containers/certs.d/image-registry.openshift-image-registry.svc:5000
                readOnly: true
            script: |
              #!/bin/bash
              set -euo pipefail
              registry=${IMAGE%%/*}
              graph_root="$(workspaces.source.path)/buildah"
              cat /var/run/secrets/kubernetes.io/serviceaccount/token | \
                buildah login --username serviceaccount --password-stdin "$registry" >/dev/null
              buildah --root "$graph_root" --storage-driver=overlay bud --isolation=chroot -f Containerfile -t "$IMAGE" .
              buildah --root "$graph_root" --storage-driver=overlay push \
                --digestfile "$(results.IMAGE_DIGEST.path)" "$IMAGE" "docker://$IMAGE"
              printf '%s' "$IMAGE" > "$(results.IMAGE.path)"
