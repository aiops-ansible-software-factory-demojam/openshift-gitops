---
# Forgejo expands the origin URL when generating a collection.
schemaVersion: 2.2.2
metadata:
  name: ansible-collection
  displayName: Ansible collection workspace
  tags:
    - Ansible
projects:
  - name: collection
    git:
      remotes:
        origin: __FORGEJO_URL__/${REPO_OWNER}/${REPO_NAME}.git
      checkoutFrom:
        revision: main
components:
  - name: tools
    container:
      image: ghcr.io/ansible/community-ansible-dev-tools:latest
      memoryLimit: 2Gi
      memoryRequest: 512Mi
      cpuRequest: 250m
      mountSources: true
commands:
  - id: deps
    exec:
      label: install collection dependencies
      component: tools
      commandLine: ansible-galaxy collection install -r requirements.yml
      workingDir: /projects/collection
      group:
        kind: build
        isDefault: true
  - id: lint
    exec:
      label: ansible-lint
      component: tools
      commandLine: ansible-lint
      workingDir: /projects/collection
      group:
        kind: test
        isDefault: true
  - id: molecule-test
    exec:
      label: molecule test (Podman container)
      component: tools
      commandLine: molecule test
      workingDir: /projects/collection/extensions
      group:
        kind: test
  - id: build
    exec:
      label: build Ansible collection
      component: tools
      commandLine: ansible-galaxy collection build --output-path /tmp
      workingDir: /projects/collection
      group:
        kind: test
