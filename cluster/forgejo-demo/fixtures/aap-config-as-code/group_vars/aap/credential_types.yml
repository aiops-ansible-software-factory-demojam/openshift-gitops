---
controller_credential_types:
  - name: Demo Kubernetes API Token
    kind: cloud
    description: Namespace-scoped API access for demo VirtualMachines
    inputs:
      fields:
        - id: kube_api_host
          label: Kubernetes API URL
          type: string
        - id: kube_api_token
          label: Service account token
          type: string
          secret: true
        - id: kube_api_ca
          label: Kubernetes API CA certificate
          type: string
          multiline: true
      required:
        - kube_api_host
        - kube_api_token
        - kube_api_ca
    injectors:
      file:
        template: !unsafe "{{ kube_api_ca }}"
      env:
        K8S_AUTH_HOST: !unsafe "{{ kube_api_host }}"
        K8S_AUTH_API_KEY: !unsafe "{{ kube_api_token }}"
        K8S_AUTH_SSL_CA_CERT: !unsafe "{{ tower.filename }}"
        K8S_AUTH_VERIFY_SSL: "true"
