---
controller_credentials:
  - name: demo-forgejo-scm
    organization: demo
    credential_type: Source Control
    inputs:
      username: demo-agent
      password: "{{ forgejo_scm_token }}"
  - name: demo-virtualmachine-deployer
    organization: demo
    credential_type: Demo Kubernetes API Token
    inputs:
      kube_api_host: "{{ vm_api_host }}"
      kube_api_token: "{{ vm_api_token }}"
      kube_api_ca: "{{ vm_api_ca }}"
