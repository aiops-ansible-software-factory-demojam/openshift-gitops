---
ansible-navigator:
  mode: stdout
  logging:
    file: /dev/null
    level: error
  execution-environment:
    enabled: true
    container-engine: podman
    environment-variables:
      pass:
        - AAP_HOST
        - AAP_USERNAME
        - AAP_PASSWORD
        - AAP_EE_IMAGE
        - FORGEJO_TOKEN
        - K8S_AUTH_HOST
        - K8S_AUTH_API_KEY
        - AAP_K8S_CA_CERT
        - K8S_AUTH_SSL_CA_CERT
  playbook-artifact:
    enable: false
