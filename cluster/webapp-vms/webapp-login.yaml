apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-login
  namespace: webapp-vms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-login
  template:
    metadata:
      labels:
        app: webapp-login
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
          args:
            - --provider=oidc
            - --http-address=0.0.0.0:4180
            - --upstream=http://webapp.webapp-vms.svc:80
            - --email-domain=*
            - --scope=openid profile email
            - --oidc-groups-claim=groups
            - --allowed-group=demo-users
            - --allowed-group=demo-admins
            - --code-challenge-method=S256
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: issuer
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: cookie-secret
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: demo-oidc
                  key: redirect-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-login
  namespace: webapp-vms
spec:
  selector:
    app: webapp-login
  ports:
    - name: http
      port: 4180
      targetPort: http
