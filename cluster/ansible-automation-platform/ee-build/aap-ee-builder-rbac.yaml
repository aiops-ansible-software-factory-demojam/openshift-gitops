apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-ee-builder
  namespace: ansible-automation-platform
---
# Buildah runs only in this one-off build identity, not in AAP job pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-ee-builder-scc
  namespace: ansible-automation-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: aap-ee-builder
    namespace: ansible-automation-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-ee-builder-registry
  namespace: ansible-automation-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: aap-ee-builder
    namespace: ansible-automation-platform
