apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: demojam-ee
  namespace: ansible-automation-platform
spec:
  description: Clone public demojam-ansible, render its EE, then build and push with Buildah.
  params:
    - name: REPO_URL
      type: string
      default: http://forgejo.forgejo.svc.cluster.local:3000/demo-owner/demojam-ansible.git
    - name: REVISION
      type: string
      default: main
    - name: IMAGE
      type: string
      default: image-registry.openshift-image-registry.svc:5000/ansible-automation-platform/demo-aap-ee:latest
  workspaces:
    - name: source
  results:
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: SOURCE_COMMIT
      value: $(tasks.fetch-source.results.SOURCE_COMMIT)
  tasks:
    - name: fetch-source
      params:
        - name: REPO_URL
          value: $(params.REPO_URL)
        - name: REVISION
          value: $(params.REVISION)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: REPO_URL
            type: string
          - name: REVISION
            type: string
        workspaces:
          - name: source
        results:
          - name: SOURCE_COMMIT
        steps:
          - name: clone
            image: ghcr.io/ansible/community-ansible-dev-tools@sha256:775c81d53058009dd47b97872f4a86d3b0a9ce16ad9af3cc48514ce4197aa787
            env:
              - name: REPO_URL
                value: $(params.REPO_URL)
              - name: REVISION
                value: $(params.REVISION)
            script: |
              #!/bin/bash
              set -euo pipefail
              git clone --depth 1 --branch "$REVISION" "$REPO_URL" "$(workspaces.source.path)/repo"
              git -C "$(workspaces.source.path)/repo" rev-parse HEAD > "$(results.SOURCE_COMMIT.path)"
    - name: render-context
      runAfter:
        - fetch-source
      taskRef:
        name: ansible-builder
      workspaces:
        - name: source
          workspace: source
    - name: build-image
      runAfter:
        - render-context
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: IMAGE
            type: string
        workspaces:
          - name: source
        results:
          - name: IMAGE_DIGEST
        volumes:
          - name: automation-hub
            secret:
              secretName: aap-ee-automation-hub
          - name: registry-auth
            secret:
              secretName: aap-ee-registry-auth
        steps:
          - name: build-and-push
            image: quay.io/buildah/stable:v1.43.2
            workingDir: $(workspaces.source.path)/context
            securityContext:
              runAsUser: 0
              privileged: true
            env:
              - name: IMAGE
                value: $(params.IMAGE)
              - name: REGISTRY_AUTH_FILE
                value: /tmp/registry-auth.json
            volumeMounts:
              - name: automation-hub
                mountPath: /run/build-secrets/automation-hub
                readOnly: true
              - name: registry-auth
                mountPath: /run/build-secrets/registry
                readOnly: true
            script: |
              #!/bin/bash
              set -euo pipefail
              cp /run/build-secrets/registry/.dockerconfigjson "$REGISTRY_AUTH_FILE"
              chmod 600 "$REGISTRY_AUTH_FILE"
              trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
              buildah --storage-driver=overlay bud --isolation=chroot \
                --secret id=automation-hub,src=/run/build-secrets/automation-hub/ansible.cfg \
                -f Containerfile -t "$IMAGE" .
              registry=${IMAGE%%/*}
              # This short-lived service account token only authenticates the push.
              cat /var/run/secrets/kubernetes.io/serviceaccount/token | \
                buildah login --tls-verify=false --username serviceaccount --password-stdin "$registry" >/dev/null
              buildah --storage-driver=overlay push --tls-verify=false \
                --digestfile "$(results.IMAGE_DIGEST.path)" "$IMAGE" "docker://$IMAGE"
