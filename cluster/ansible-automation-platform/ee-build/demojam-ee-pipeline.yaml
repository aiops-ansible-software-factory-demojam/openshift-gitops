apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: demojam-ee
  namespace: ansible-automation-platform
spec:
  description: Clone public demojam-ansible, render its EE, then build and push with Buildah.
  params:
    - name: REPO_URL
      type: string
      default: http://forgejo.forgejo.svc.cluster.local:3000/demo-owner/demojam-ansible.git
    - name: REVISION
      type: string
      default: main
    - name: IMAGE
      type: string
      default: image-registry.openshift-image-registry.svc:5000/ansible-automation-platform/demo-aap-ee:latest
  workspaces:
    - name: source
  results:
    - name: IMAGE_DIGEST
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: SOURCE_COMMIT
      value: $(tasks.fetch-source.results.SOURCE_COMMIT)
  tasks:
    - name: fetch-source
      params:
        - name: REPO_URL
          value: $(params.REPO_URL)
        - name: REVISION
          value: $(params.REVISION)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: REPO_URL
            type: string
          - name: REVISION
            type: string
        workspaces:
          - name: source
        results:
          - name: SOURCE_COMMIT
        steps:
          - name: clone
            image: ghcr.io/ansible/community-ansible-dev-tools@sha256:775c81d53058009dd47b97872f4a86d3b0a9ce16ad9af3cc48514ce4197aa787
            env:
              - name: REPO_URL
                value: $(params.REPO_URL)
              - name: REVISION
                value: $(params.REVISION)
            script: |
              #!/bin/bash
              set -euo pipefail
              git clone --depth 1 --branch "$REVISION" "$REPO_URL" "$(workspaces.source.path)/repo"
              git -C "$(workspaces.source.path)/repo" rev-parse HEAD > "$(results.SOURCE_COMMIT.path)"
    - name: render-context
      runAfter:
        - fetch-source
      taskRef:
        name: ansible-builder
      workspaces:
        - name: source
          workspace: source
    - name: import-base
      runAfter:
        - render-context
      params:
        - name: BASE_IMAGE
          value: $(tasks.render-context.results.BASE_IMAGE)
      taskSpec:
        params:
          - name: BASE_IMAGE
            type: string
        steps:
          - name: import
            image: registry.redhat.io/openshift4/ose-cli:latest@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
            securityContext:
              runAsUser: 1000
            env:
              - name: BASE_IMAGE
                value: $(params.BASE_IMAGE)
            script: |
              #!/bin/bash
              set -euo pipefail
              # OpenShift imports using its existing cluster registry credentials.
              oc -n ansible-automation-platform import-image demo-aap-ee-base:latest \
                --from="$BASE_IMAGE" --reference-policy=local --confirm >/dev/null
    - name: build-image
      runAfter:
        - import-base
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: IMAGE
            type: string
        workspaces:
          - name: source
        results:
          - name: IMAGE_DIGEST
        volumes:
          - name: automation-hub
            secret:
              secretName: aap-ee-automation-hub
          - name: registry-ca
            configMap:
              name: openshift-service-ca.crt
        steps:
          - name: build-and-push
            image: quay.io/buildah/stable:v1.43.2
            workingDir: $(workspaces.source.path)/context
            securityContext:
              runAsUser: 0
              privileged: true
            env:
              - name: IMAGE
                value: $(params.IMAGE)
            volumeMounts:
              - name: automation-hub
                mountPath: /run/build-secrets/automation-hub
                readOnly: true
              - name: registry-ca
                mountPath: /etc/containers/certs.d/image-registry.openshift-image-registry.svc:5000
                readOnly: true
            script: |
              #!/bin/bash
              set -euo pipefail
              registry=${IMAGE%%/*}
              # Runtime token is only sent to the internal registry, never printed.
              cat /var/run/secrets/kubernetes.io/serviceaccount/token | \
                buildah login --username serviceaccount --password-stdin "$registry" >/dev/null
              buildah --storage-driver=overlay bud --isolation=chroot \
                --secret id=automation-hub,src=/run/build-secrets/automation-hub/ansible.cfg \
                --build-arg "EE_BASE_IMAGE=$registry/ansible-automation-platform/demo-aap-ee-base:latest" \
                -f Containerfile -t "$IMAGE" .
              buildah --storage-driver=overlay push \
                --digestfile "$(results.IMAGE_DIGEST.path)" "$IMAGE" "docker://$IMAGE"
