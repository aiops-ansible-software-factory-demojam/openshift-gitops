apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ingress_type: Route
  service_type: ClusterIP
  route_tls_termination_mechanism: Edge
  redis_mode: standalone
  api:
    replicas: 1
  redis:
    replicas: 1
  database:
    postgres_data_volume_init: false
    postgres_storage_class: ocs-external-storagecluster-ceph-rbd
  controller:
    disabled: false
    replicas: 1
    web_liveness_period: 0
  eda:
    disabled: false
    api:
      replicas: 1
    ui:
      replicas: 1
    worker:
      replicas: 1
    default_worker:
      replicas: 1
    activation_worker:
      replicas: 1
    event_stream:
      replicas: 1
  hub:
    disabled: true
  mcp:
    disabled: true
  lightspeed:
    disabled: true
  metrics:
    disabled: true
