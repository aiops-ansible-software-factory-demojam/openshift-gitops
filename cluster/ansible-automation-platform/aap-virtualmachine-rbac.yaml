apiVersion: v1
kind: Namespace
metadata:
  name: automation-vms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-vm-admin
  namespace: automation-vms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-vm-admin
  namespace: automation-vms
rules:
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
      - events
      - services
    verbs:
      - get
      - list
      - watch
---
# CDI needs this permission to clone an OS disk from an SSP DataSource.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-vm-cloner
  namespace: openshift-virtualization-os-images
rules:
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes/source
    verbs:
      - create
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datasources
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-vm-admin-clone
  namespace: openshift-virtualization-os-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aap-vm-cloner
subjects:
  - kind: ServiceAccount
    name: aap-vm-admin
    namespace: automation-vms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-vm-admin
  namespace: automation-vms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aap-vm-admin
subjects:
  - kind: ServiceAccount
    name: aap-vm-admin
    namespace: automation-vms
