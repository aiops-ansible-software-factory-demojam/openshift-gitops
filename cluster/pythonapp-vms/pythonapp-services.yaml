apiVersion: v1
kind: Service
metadata:
  name: pythonapp
  namespace: pythonapp-vms
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pythonapp-ssh
  namespace: pythonapp-vms
spec:
  ports:
    - name: ssh
      port: 22
      targetPort: 22
