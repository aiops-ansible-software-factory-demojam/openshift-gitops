apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-kata
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  envVarsInjectionPolicy: Disallowed
  networkPolicyManagement: Unmanaged
  service: false
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-session
    spec:
      runtimeClassName: kata
      nodeSelector:
        sandbox.demo/enabled: "true"
      serviceAccountName: sandbox
      automountServiceAccountToken: false
      activeDeadlineSeconds: 7200
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          image: registry.access.redhat.com/ubi9/python-312@sha256:608649675c344ac80d58842b883515f39a2232398386805bc6a741f823340a4e
          command:
            - /bin/bash
            - -ec
            - exec sleep infinity
          workingDir: /workspace
          env:
            - name: HOME
              value: /workspace
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - test -w /workspace && python3 -c "print(1)"
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
