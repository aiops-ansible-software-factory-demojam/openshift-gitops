apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-capacity
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    pods: "6"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 20Gi
    requests.ephemeral-storage: 12Gi
    limits.ephemeral-storage: 24Gi
    count/sandboxclaims.extensions.agents.x-k8s.io: "4"
    count/sandboxes.agents.x-k8s.io: "6"
