apiVersion: batch/v1
kind: CronJob
metadata:
  name: sandbox-cleanup
  namespace: agent-sandbox-clients
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: sandbox-cleanup
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.18
              command:
                - /bin/bash
                - /scripts/cleanup.sh
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: sandbox-cleanup
