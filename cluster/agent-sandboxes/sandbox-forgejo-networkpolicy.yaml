apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-forgejo
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
      ports:
        - protocol: TCP
          port: 3000
