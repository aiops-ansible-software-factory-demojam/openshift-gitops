apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
