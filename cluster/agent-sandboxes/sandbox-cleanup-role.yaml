apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-cleanup
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - delete
