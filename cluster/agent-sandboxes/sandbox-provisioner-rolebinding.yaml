apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-provisioner
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-provisioner
subjects:
  - kind: ServiceAccount
    name: sandbox-provisioner
    namespace: agent-sandbox-clients
