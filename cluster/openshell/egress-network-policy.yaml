# OVN egress firewall. In-cluster traffic is not covered. The name must be
# default. Sandbox pods are separately denied external egress by NetworkPolicy.
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: openshell
spec:
  egress:
    - type: Allow
      to:
        dnsName: opencode.ai
    - type: Allow
      to:
        dnsName: sso.apps.cluster-qb5wm.dyn.redhatworkshops.io
    - type: Allow
      to:
        cidrSelector: 10.10.10.0/24
    - type: Allow
      to:
        cidrSelector: 10.232.0.0/14
    # opencode.ai currently resolves inside RFC1918-overlapping 172.16/12,
    # which the gateway NetworkPolicy deliberately excludes by default.
    - type: Allow
      to:
        cidrSelector: 172.65.90.0/24
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
