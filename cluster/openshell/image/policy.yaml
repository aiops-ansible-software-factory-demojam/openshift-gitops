version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /opt
    - /var/log
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
network_policies:
  omnigent:
    endpoints:
      - host: omnigent.omnigent.svc.cluster.local
        port: 8000
        tls: skip
    binaries:
      - path: /**
  opencode-go:
    endpoints:
      - host: opencode.ai
        port: 443
        tls: skip
    binaries:
      - path: /**
  litellm-maas:
    endpoints:
      - host: maas-rhdp.apps.maas.redhatworkshops.io
        port: 443
        tls: skip
    binaries:
      - path: /**
  packages:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        tls: skip
    binaries:
      - path: /**
  forgejo:
    endpoints:
      - host: forgejo-demo.forgejo-demo.svc.cluster.local
        port: 3000
        tls: skip
    binaries:
      - path: /**
  backstage:
    endpoints:
      - host: backstage-rhdh-developer-hub.rhdh.svc.cluster.local
        port: 80
        tls: skip
    binaries:
      - path: /**
