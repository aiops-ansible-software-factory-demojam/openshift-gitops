apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-sandbox-privileged
  namespace: openshell
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-scc-privileged
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: openshell
