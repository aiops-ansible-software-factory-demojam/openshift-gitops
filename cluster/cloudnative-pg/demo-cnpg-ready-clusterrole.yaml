apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-cnpg-ready
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - clusters.postgresql.cnpg.io
      - databases.postgresql.cnpg.io
    verbs:
      - get
      - list
      - watch
