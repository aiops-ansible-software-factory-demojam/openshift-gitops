name: omnigent-dispatch
description: Launch automation-developer to implement a Forgejo collection issue.
schema_version: 2.0.0
triggers:
  - id: start
    name: Enter a Forgejo issue number
    type: manual_trigger
    position:
      x: 0
      y: 300
    parameters:
      input_schema:
        type: object
        required:
          - issue_number
        properties:
          issue_number:
            type: integer
            title: Collection issue number
            minimum: 1
nodes:
  - id: create_session
    name: Create managed Agent Sandbox session
    type: http_request
    position:
      x: 300
      y: 300
    parameters:
      method: POST
      url: http://omnigent.omnigent.svc:8080/v1/sessions
      headers:
        Content-Type: application/json
      body:
        agent_id: DEMO_AGENT_ID
        host_type: managed
        title: Collection feature issue
        initial_items: []
    settings:
      timeout: 360
      retry_policy:
        max_retries: 0
  - id: send_task
    name: Send task to agent
    type: http_request
    position:
      x: 600
      y: 300
    parameters:
      method: POST
      url: http://omnigent.omnigent.svc:8080/v1/sessions/${create_session.body.id}/events
      headers:
        Content-Type: application/json
      body:
        type: message
        data:
          role: user
          content:
            - type: input_text
              text: |
                Work on Forgejo issue #${trigger.issue_number} in
                demo-owner/ansible-collection-demo. Run
                forgejo-issue start ${trigger.issue_number} to review it and
                prepare the feature branch. Follow the issue and AGENTS.md,
                implement the change, and check every acceptance criterion.
                Exercise UID-dependent Ansible conditions with a YAML integer
                nginx_uid: 1500 using ansible-playbook; syntax checks alone
                cannot detect runtime template errors.
                Review the 1500-to-1501 transition: stop running nginx workers
                before changing their account UID, then restore the service.
                If using getent_passwd, verify the UID field with an account
                whose UID and GID differ.
                Run ansible-lint, default yamllint, and a collection build.
                Do not change sandbox system accounts or attempt nested Podman
                to simulate a Rocky Linux host. Report unavailable runtime
                checks as unverified. Review the diff and PR body for accuracy,
                commit the change, then use
                forgejo-issue submit ${trigger.issue_number} --body-file <path>
                to push and open a PR. Report the PR URL. Do not merge.
    settings:
      timeout: 360
      retry_policy:
        max_retries: 12
        initial_interval: 5
        max_interval: 20
        backoff_coefficient: 1.5
edges:
  - from: start
    to: create_session
  - from: create_session
    to: send_task
