name: aap-webapp-nginx
description: Dispatch the existing webapp nginx configuration job through AAP.
schema_version: 2.0.0
triggers:
  - id: start
    name: Configure webapp nginx
    type: manual_trigger
    parameters: {}
    position:
      x: 0
      y: 300
nodes:
  - id: configure_nginx
    name: Run the webapp nginx job
    type: aap_job_template
    position:
      x: 300
      y: 300
    parameters:
      organization_name: demo
      job_template_name: webapp_nginx
    settings:
      timeout: 1800
      retry_policy:
        max_retries: 0
edges:
  - from: start
    to: configure_nginx
