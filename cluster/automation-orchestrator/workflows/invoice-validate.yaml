name: invoice-validate
description: Independently test a published collection SHA on ephemeral RHEL EC2 instances through AAP.
schema_version: 2.0.0
triggers:
  - id: start
    name: Validate the published PR commit
    type: manual_trigger
    parameters:
      input_schema:
        type: object
        required: [invoice_candidate_sha]
        properties:
          invoice_candidate_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
    position: {x: 0, y: 300}
nodes:
  - id: validate_invoice
    name: AAP validates the exact candidate on disposable RHEL machines
    type: aap_job_template
    position: {x: 300, y: 300}
    parameters:
      organization_name: demo
      job_template_name: invoice_validate
      extra_vars:
        invoice_candidate_sha: '${trigger.invoice_candidate_sha}'
    settings:
      timeout: 7200
      retry_policy: {max_retries: 0}
edges:
  - {from: start, to: validate_invoice}
