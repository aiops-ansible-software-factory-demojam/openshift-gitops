apiVersion: v1
kind: ConfigMap
metadata:
  name: automation-orchestrator-admin-settings
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  # The cluster's ingress DNS resolves the in-cluster Keycloak Route to a private IP.
  APP_OIDC_ALLOW_PRIVATE_NETWORKS: "true"
