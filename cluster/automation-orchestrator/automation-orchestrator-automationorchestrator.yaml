apiVersion: aap.ansible.com/v1alpha1
kind: AutomationOrchestrator
metadata:
  name: automation-orchestrator
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  workflowHttpRequestAllowedHosts:
    # The workflow validator blocks .svc.cluster.local before checking this list.
    - omnigent.omnigent.svc
    - backstage-feature-gate.automation-orchestrator.svc
  postgres:
    host: orchestrator-pg-rw
    port: 5432
    sslMode: verify-ca
    caCertSecretRef:
      name: orchestrator-pg-ca
    backendDatabase:
      secretRef:
        name: orchestrator-pg-credentials
    temporalDatabase:
      secretRef:
        name: temporal-pg-credentials
  ingress:
    type: Route
  secrets:
    initialAdminPasswordSecretRef:
      name: automation-orchestrator-admin-password
  backend:
    replicas: 1
    additionalAnnotations:
      # Reload the optional admin settings when upgrading an existing instance.
      demojam.io/oidc-private-networks: "true"
  ui:
    replicas: 1
  worker:
    replicas: 1
  temporal:
    server:
      replicas: 1
