apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-webhook-ingress
  namespace: automation-orchestrator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/name: automation-orchestrator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ansible-automation-platform
      ports:
        - protocol: TCP
          port: 8080
