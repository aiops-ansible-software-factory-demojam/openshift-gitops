apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automation-orchestrator-sandbox-api
  namespace: agent-sandboxes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
