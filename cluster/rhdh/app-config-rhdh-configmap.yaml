apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  app-config.yaml: |
    app:
      title: Demo Developer Hub
      baseUrl: ${RHDH_URL}
    backend:
      baseUrl: ${RHDH_URL}
      auth:
        externalAccess:
          - type: static
            options:
              token: ${BACKSTAGE_TOKEN}
              subject: demo-automation
            accessRestrictions:
              - plugin: catalog
              - plugin: scaffolder
              - plugin: proxy
      database:
        client: pg
        connection:
          host: rhdh-pg-rw
          port: 5432
          user: ${username}
          password: ${password}
    auth:
      environment: production
      session:
        secret: ${DEMO_OIDC_SESSION_SECRET}
      providers:
        oidc:
          production:
            clientId: ${DEMO_OIDC_CLIENT_ID}
            clientSecret: ${DEMO_OIDC_CLIENT_SECRET}
            metadataUrl: ${DEMO_OIDC_ISSUER}
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
    signInPage: oidc
    permission:
      enabled: false
    integrations:
      gitea:
        - host: ${FORGEJO_HOST}
          username: ${FORGEJO_USERNAME}
          password: ${FORGEJO_TOKEN}
    proxy:
      endpoints:
        '/forgejo':
          target: http://forgejo.forgejo.svc:3000/api/v1
          allowedMethods:
            - GET
            - POST
          headers:
            Authorization: token ${FORGEJO_TOKEN}
    catalog:
      locations:
        - type: file
          target: /opt/app-root/src/demo-users.yaml
          rules:
            - allow:
                - User
        - type: file
          target: /opt/app-root/src/ansible-collection-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/ansible-collection-feature-template.yaml
          rules:
            - allow:
                - Template
        - type: url
          target: ${FORGEJO_URL}/demo-owner/ansible-collection-demo/src/branch/main/catalog-info.yaml
