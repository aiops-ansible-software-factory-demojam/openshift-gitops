apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: webapp
  namespace: blackbox-exporter
spec:
  jobName: webapp
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://webapp.webapp-vms.svc.cluster.local/
