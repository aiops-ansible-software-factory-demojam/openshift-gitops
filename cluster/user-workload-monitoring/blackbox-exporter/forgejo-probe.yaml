apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: forgejo-demo
  namespace: blackbox-exporter
spec:
  jobName: forgejo-demo
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://forgejo-demo.forgejo-demo.svc.cluster.local:3000/
