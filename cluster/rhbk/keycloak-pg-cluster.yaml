apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:15.18
  bootstrap:
    initdb:
      database: keycloak
      owner: changeme
      secret:
        name: keycloak-pg-credentials
  storage:
    size: 10Gi
  postgresql:
    parameters:
      max_connections: "200"
